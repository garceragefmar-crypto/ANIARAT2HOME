<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback – AniArat2Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@700&family=League+Spartan:wght@400;600;700;800&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="shop.css"></head><body data-page="feedback">
<header class="hero page"><button class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><span>MENU</span></button>
<div class="stack"><img src="assets/logo-circle.png" alt=""><img src="assets/wordmark.png" alt="AniArat2Home"></div>
<h1>Feedback</h1><p>Rate our website and tell us how to improve.</p></header>
<main class="shopwrap"><div class="narrow">
<section class="panel"><form id="ff" novalidate>
<div class="f"><span class="lbl" id="rl">How would you rate our website?</span><div class="stars" role="radiogroup" aria-labelledby="rl"><input type="radio" name="rate" id="r5" value="5"><label for="r5" title="5 stars"><span class="sr">5 stars</span>★</label><input type="radio" name="rate" id="r4" value="4"><label for="r4" title="4 stars"><span class="sr">4 stars</span>★</label><input type="radio" name="rate" id="r3" value="3"><label for="r3" title="3 stars"><span class="sr">3 stars</span>★</label><input type="radio" name="rate" id="r2" value="2"><label for="r2" title="2 stars"><span class="sr">2 stars</span>★</label><input type="radio" name="rate" id="r1" value="1"><label for="r1" title="1 star"><span class="sr">1 star</span>★</label></div><span class="rate-txt" id="rt" aria-live="polite"></span><p class="err" id="e-rate" role="alert"></p></div>
<div class="f"><label for="fn">Name (optional)</label><input id="fn" autocomplete="name"></div>
<div class="f"><label for="fc">Comments</label><textarea id="fc" rows="4" placeholder="What did you like, or what went wrong?"></textarea></div>
<div class="f"><label for="fs">Suggestions</label><textarea id="fs" rows="4" placeholder="What should we add or improve?"></textarea></div>
<button class="btn-sm" type="submit" style="width:auto;padding:13px 34px">SEND FEEDBACK</button></form>
<div id="fthanks" class="done" hidden style="margin-top:0"><h2>Thank you!</h2><p style="margin:8px 0 16px;font-weight:700">Your feedback helps us grow a better farm-to-home shop.</p><div class="acts"><a id="fmail" class="btn-sm" href="#">EMAIL IT TO US</a><button id="fagain" class="btn-sm alt" type="button">SEND ANOTHER</button></div></div></section>
<section id="fhist" class="panel" style="margin-top:22px" hidden><h2>Your feedback</h2><p id="favg" style="font-weight:800;color:var(--green)"></p><div id="flist"></div></section>
</div></main>
<div id="toast" class="toast" role="status"></div>
<script src="products.js"></script><script src="auth.js"></script><script src="site.js"></script><script src="app.js"></script></body></html>
